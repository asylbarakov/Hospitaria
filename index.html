<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10222e">
  <title>Больница</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23e53935'/%3E%3Cpath d='M26 14h12v12h12v12H38v12H26V38H14V26h12z' fill='white'/%3E%3C/svg%3E"
  >

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #1c3d4d 0%, #10222e 70%);
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      touch-action: none;
    }

    /* Экран загрузки: исчезает, когда игра запустилась (см. BootScene). */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: #cfe6ef;
      font-family: Arial, "Segoe UI", sans-serif;
      font-size: 20px;
      text-align: center;
      padding: 0 24px;
    }
    #loader .cross {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #e53935;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      animation: pulse 1.1s ease-in-out infinite;
    }
    #loader .cross::before,
    #loader .cross::after {
      content: "";
      position: absolute;
      background: #fff;
      border-radius: 3px;
    }
    #loader .cross::before { left: 29px; top: 14px; width: 14px; height: 44px; }
    #loader .cross::after { left: 14px; top: 29px; width: 44px; height: 14px; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="cross"></div>
    <p id="loader-text">Загрузка больницы…</p>
  </div>
  <div id="game"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
  <script>
    // Если Phaser не загрузился (нет интернета), не оставляем вечную «Загрузку».
    setTimeout(function () {
      var text = document.getElementById('loader-text');
      if (text) {
        text.textContent = 'Не удалось загрузить игру. Проверьте интернет и обновите страницу.';
      }
    }, 12000);
  </script>
</body>
</html>
